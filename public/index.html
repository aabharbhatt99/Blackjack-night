<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blackjack Night</title>
<meta name="theme-color" content="#0b1210">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1210;--panel:#121a17;--panel2:#0b1210;--line:#22302a;--line2:#2c3d34;--fg:#eef3ef;--muted:#a9bcb1;--gold:#e3b84f;--gold2:#f3d27e;--goldbg:#1a1406;--green:#8fe0ad;--red:#ff9d8f;--felt:#1d7a4f;--felt2:#0d3f27}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.4 Inter,system-ui,sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:not-allowed}
.hd{font-family:'Space Grotesk',sans-serif}
#app{height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* fullscreen toggle */
.fsb{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line2);background:rgba(11,18,16,.55);color:var(--fg);padding:0}
.fsb:hover{border-color:var(--gold);color:var(--gold2)}
.nofs .fsb{display:none}
.hero .fsb{position:absolute;top:16px;right:16px;z-index:2}
.topline .fsb{display:none}

/* ---------- entry: name once, then Create or Join ---------- */
.entry{height:100%;display:flex;overflow:auto}
.hero{flex:1 1 480px;min-width:0;padding:24px;display:flex}
.hero .felt2{flex:1;position:relative;overflow:hidden;border-radius:28px;background:radial-gradient(ellipse at 50% 30%,var(--felt),var(--felt2) 78%);box-shadow:inset 0 0 0 2px rgba(227,184,79,.35),inset 0 0 90px rgba(0,0,0,.45);padding:36px 40px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.logo{font:700 22px 'Space Grotesk',sans-serif;display:flex;align-items:center;gap:10px}.logo span{color:var(--gold)}
.fan{position:relative;width:300px;height:230px;margin:0 auto;flex:none}
.fan .fc{position:absolute;width:104px;height:150px;border-radius:12px;background:#fff;color:#111;box-shadow:0 18px 30px rgba(0,0,0,.45);font:700 30px/1 'Space Grotesk',sans-serif}
.fan .fc .r{position:absolute;left:10px;top:10px}.fan .fc .s{position:absolute;left:11px;top:44px;font-size:24px}.fan .fc .c{position:absolute;right:10px;bottom:8px;font-size:44px}
.fan .fc.red{color:#c0392b}
.fan .fc.bk{background:repeating-linear-gradient(45deg,#8a2333 0 8px,#6b1a27 8px 16px);box-shadow:inset 0 0 0 4px #fff,0 18px 30px rgba(0,0,0,.45)}
.fan .stk{position:absolute;display:flex;flex-direction:column-reverse}
.fan .stk i{width:46px;height:16px;border-radius:50%;border:3px dashed rgba(255,255,255,.8);box-shadow:0 3px 0 rgba(0,0,0,.45);box-sizing:border-box}
.fan .stk i+i{margin-bottom:-9px}
.hero h2{margin:0;font:700 40px/1.1 'Space Grotesk',sans-serif}
.hero p{margin:8px 0 18px;font-size:16px;color:rgba(255,255,255,.78);max-width:420px}
.hero .sub2{display:none;font-size:13px;color:rgba(255,255,255,.78);margin-top:4px}
.facts{display:flex;flex-wrap:wrap;gap:8px}.facts span{padding:6px 12px;border-radius:99px;background:rgba(0,0,0,.28);border:1px solid rgba(227,184,79,.4);color:var(--gold2);font-size:13px;font-weight:600}
.form{flex:1 1 520px;min-width:0;display:flex;align-items:center;justify-content:center;padding:40px 32px}
.form .box{width:100%;max-width:440px;display:flex;flex-direction:column;gap:24px}
.form h1{margin:6px 0 0;font:700 36px/1.1 'Space Grotesk',sans-serif}
.fld{display:flex;flex-direction:column;gap:8px}
.fld>label,.fld>.lb{font-size:14px;font-weight:600;color:var(--muted)}
.fld .note{font-size:13px;color:var(--muted)}
.fld input{margin:0;height:56px;padding:0 16px;border-radius:14px;border:2px solid var(--line2);font:600 18px Inter,sans-serif}
.fld input:focus{outline:0;border-color:var(--gold)}
.fld input.code{height:80px;font:700 34px 'Space Grotesk',sans-serif;letter-spacing:.4em;text-align:center;text-transform:uppercase;padding:0 0 0 .4em;color:var(--gold2)}
.lbrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.lbrow small{font-size:13px;color:var(--muted)}.lbrow small b{color:var(--gold2)}
.path{display:flex;align-items:center;gap:16px;width:100%;padding:18px 20px;border-radius:18px;color:var(--fg);background:var(--panel);border:1px solid var(--line2);text-align:left;font:inherit}
.path:hover{background:#17221d;border-color:var(--gold)}
.path.gold{background:var(--goldbg);border-color:var(--gold)}.path.gold:hover{background:#221a08}
.path .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;background:#1d2a24;border:1px solid #3a5045}
.path.gold .ic{background:var(--gold);border:0}
.path .tx{flex:1;min-width:0}.path .tx b{display:block;font:700 19px 'Space Grotesk',sans-serif}.path .tx span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.seg2{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--panel);border:1px solid var(--line2)}
.seg2 button{flex:1;display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-radius:12px;border:0;background:transparent;color:var(--muted);font-size:13px;text-align:left}
.seg2 button b{font:700 16px 'Space Grotesk',sans-serif;color:var(--fg)}
.seg2 button:hover{background:#17221d}
.seg2 button.on{background:var(--gold);color:#3a2c05}.seg2 button.on b{color:#1e1600}
.pills{display:grid;gap:8px}
.pills button{height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);color:var(--fg);font:700 16px 'Space Grotesk',sans-serif;padding:0}
.pills button:hover{border-color:var(--gold)}
.pills button.on{border:2px solid var(--gold);background:var(--goldbg);color:var(--gold2)}
.info{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:14px;color:var(--muted)}.info svg{flex:none;margin-top:1px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bkbtn{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px 0 10px;border-radius:12px;border:1px solid var(--line2);background:transparent;color:var(--fg);font-size:14px;font-weight:600}
.bkbtn:hover{background:#17221d}
.as{font-size:14px;color:var(--muted)}.as b{color:var(--gold2)}
.linkb{background:none;border:0;padding:0;color:var(--gold);font:inherit;font-weight:600}.linkb:hover{color:var(--gold2)}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;border-radius:16px;border:0;background:var(--gold);color:#1e1600;font:700 18px 'Space Grotesk',sans-serif;box-shadow:0 8px 22px rgba(227,184,79,.28)}
.go:hover:not(:disabled){background:var(--gold2)}
.go-wrap{display:flex;flex-direction:column;gap:14px}
.mlogo{display:none}
.center-note{text-align:center;font-size:14px;color:var(--muted)}
/* short desktop windows: shrink the hero art before anything scrolls */
@media (max-height:760px) and (min-width:861px){.fan{transform:scale(.75);height:172px}.hero h2{font-size:32px}.form .box{gap:18px}.form h1{font-size:30px}}
/* phone: a compact felt band on step 1, a slim header on step 2 */
@media (max-width:860px){
  .entry{flex-direction:column}
  .hero{flex:none;padding:16px 16px 0}
  .hero .felt2{height:190px;padding:20px;border-radius:22px}
  .hero .logo{font-size:19px}
  .fan{position:absolute;right:-24px;top:34px;transform:scale(.55);transform-origin:top right}
  .hero h2{font-size:26px;max-width:190px}.hero p,.facts{display:none}.hero .sub2{display:block;max-width:165px}
  .entry.step2 .hero{display:none}
  .entry.step2 .topline .fsb{display:inline-flex}.nofs .entry.step2 .topline .fsb{display:none}
  .entry.step2 .mlogo{display:block;flex:1;font:700 17px 'Space Grotesk',sans-serif}.mlogo span{color:var(--gold)}
  .form{flex:1;align-items:stretch;padding:16px}
  .form .box{gap:20px;max-width:none}
  .form h1{font-size:28px;margin-top:4px}
  .entry.step2 .go-wrap{margin-top:auto}
  .path{padding:14px 16px;gap:14px}.path .ic{width:44px;height:44px}.path .tx b{font-size:17px}.path .tx span{font-size:13px}
  .seg2 button{padding:10px 12px}
  .pills{gap:6px}.pills button{height:46px;font-size:15px}
  .pills.players{grid-template-columns:repeat(5,minmax(0,1fr))!important}
  .fld input.code{height:72px;font-size:30px}
  .bkbtn .bt,.as .chg{display:none}.bkbtn{width:44px;padding:0;justify-content:center}
}
.card-p{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
label{font-size:13px;color:var(--muted)}
input{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);color:var(--fg);margin:6px 0 12px}
.cpu{display:inline-block;font:700 9px Inter,sans-serif;letter-spacing:.1em;color:var(--muted);border:1px solid var(--line2);border-radius:99px;padding:1px 5px;margin-left:5px;vertical-align:2px}
input:focus{outline:2px solid var(--gold);outline-offset:1px}
.btn{height:50px;border-radius:14px;border:0;padding:0 18px;font-weight:700;font-size:15px}
.btn.gold{background:var(--gold);color:#1e1600;box-shadow:0 6px 18px rgba(227,184,79,.25)}
.btn.gold:hover:not(:disabled){background:var(--gold2)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line2)}
.btn.ghost:hover:not(:disabled){background:#17221d}
.btn.w{width:100%}
.err{color:var(--red);font-size:14px;margin:0}

/* ---------- game layout ---------- */
.game{height:100%;display:flex}
.tablewrap{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 0;font-size:14px;color:var(--muted);gap:12px}
.topbar b{font:700 18px 'Space Grotesk',sans-serif;color:var(--fg);margin-right:8px}
.stagebox{flex:1;min-height:0;position:relative}
.stage{position:absolute;left:50%;top:50%;width:1000px;height:730px;transform-origin:center}
.rail{position:absolute;left:0;right:0;top:80px;height:620px;border-radius:18px 18px 50% 50%/18px 18px 72% 72%;background:linear-gradient(180deg,#5a3519,#3a2110);box-shadow:0 30px 60px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.12)}
.felt{position:absolute;inset:18px;border-radius:10px 10px 50% 50%/10px 10px 72% 72%;background:radial-gradient(ellipse at 50% 18%,var(--felt),var(--felt2) 78%);box-shadow:inset 0 0 0 2px rgba(227,184,79,.35),inset 0 0 80px rgba(0,0,0,.45)}
.feltsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.deck{position:absolute;left:290px;top:116px;width:66px;height:96px;transform:rotate(-8deg);z-index:1;pointer-events:none}
.deck .slot{position:absolute;inset:-8px;border-radius:12px;border:2px solid rgba(227,184,79,.35);background:rgba(0,0,0,.18)}
.deck .layer{position:absolute;left:0;top:0;width:66px;height:96px;border-radius:8px;background:repeating-linear-gradient(45deg,#8a2333 0 6px,#6b1a27 6px 12px);box-shadow:inset 0 0 0 3px #fff,0 1px 0 #d9d9d9,0 2px 3px rgba(0,0,0,.35)}
.deck .count{position:absolute;left:50%;top:-30px;transform:translateX(-50%) rotate(8deg);font:600 12px Inter,sans-serif;letter-spacing:.08em;color:rgba(255,255,255,.65);white-space:nowrap}
.center{position:absolute;left:50%;top:300px;transform:translateX(-50%);text-align:center;font:600 20px 'Space Grotesk',sans-serif;color:rgba(255,255,255,.9);width:420px;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.center small{display:block;font:500 13px Inter,sans-serif;color:rgba(255,255,255,.6);margin-top:2px}

.seat{position:absolute;width:190px;display:flex;flex-direction:column;align-items:center;gap:8px;transform:translate(-50%,-50%);transition:left .9s cubic-bezier(.65,0,.35,1),top .9s cubic-bezier(.65,0,.35,1);z-index:2}
.seat.dealerseat{width:240px;flex-direction:column-reverse}
.seat.off{opacity:.45}
.plate{position:relative;background:rgba(10,16,13,.92);border:1px solid var(--line2);border-radius:14px;padding:8px 16px;text-align:center;min-width:140px;transition:border-color .3s,box-shadow .3s}
.plate.mine{background:var(--goldbg);border:2px solid var(--gold);box-shadow:0 0 22px rgba(227,184,79,.4);padding-top:12px}
.plate.mine .pn{color:var(--gold2)}
.plate.turn{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 26px rgba(227,184,79,.5)}
.plate.mine.turn{box-shadow:0 0 0 3px rgba(227,184,79,.35),0 0 30px rgba(227,184,79,.6)}
.me-badge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--gold);color:#2a1e00;font:700 11px Inter,sans-serif;letter-spacing:.14em;padding:2px 10px;border-radius:99px;box-shadow:0 0 12px rgba(227,184,79,.7);white-space:nowrap}
.pn{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.ps{font-size:14px;color:var(--muted);font-weight:600}
.pc{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;background:var(--gold);color:#2a1e00;padding:2px 8px;border-radius:99px;margin-bottom:3px}
.tag.o{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.win{color:var(--green)!important}.lose{color:var(--red)!important}.goldt{color:var(--gold2)!important}

.hand{display:flex;align-items:center;min-height:84px;position:relative}
.hand.big{min-height:96px}
.card{width:58px;height:84px;position:relative;flex:none;font:700 20px/1 'Space Grotesk',sans-serif;transform-style:preserve-3d}
.card+.card{margin-left:-18px}
.big .card{width:66px;height:96px;font-size:23px}
.big .card+.card{margin-left:-24px}
.hand .card:nth-child(n+4){margin-left:-30px} /* long hands stay narrow */
/* compact seats (6+ players): the dealer keeps full size */
.stage.compact .seat:not(.dealerseat){width:130px;gap:6px}
.stage.compact .seat:not(.dealerseat) .hand{min-height:66px}
.stage.compact .seat:not(.dealerseat) .hand.big{min-height:76px}
.stage.compact .seat:not(.dealerseat) .card{width:46px;height:66px;font-size:16px}
.stage.compact .seat:not(.dealerseat) .card+.card{margin-left:-22px}
.stage.compact .seat:not(.dealerseat) .card .r{left:5px;top:5px}
.stage.compact .seat:not(.dealerseat) .card .s{left:6px;top:22px;font-size:13px}
.stage.compact .seat:not(.dealerseat) .card .c{right:5px;bottom:3px;font-size:20px}
.stage.compact .seat:not(.dealerseat) .hand.big .card{width:52px;height:76px;font-size:18px}
.stage.compact .seat:not(.dealerseat) .hand.big .card .s{top:25px;font-size:14px}
.stage.compact .seat:not(.dealerseat) .hand.big .card .c{font-size:23px}
.stage.compact .seat:not(.dealerseat) .face{border-radius:7px}
.stage.compact .seat:not(.dealerseat) .tot{font-size:12px;right:-5px;top:-7px;padding:1px 6px}
.stage.compact .seat:not(.dealerseat) .plate{padding:5px 10px;min-width:100px;border-radius:12px}
.stage.compact .seat:not(.dealerseat) .plate.mine{padding-top:10px}
.stage.compact .seat:not(.dealerseat) .pn{font-size:14px;max-width:120px}
.stage.compact .seat:not(.dealerseat) .ps{font-size:12px}
.stage.compact .seat:not(.dealerseat) .pc{font-size:11px}
.stage.compact .seat:not(.dealerseat) .tag{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);font-size:9px;padding:1px 6px;margin:0;white-space:nowrap;z-index:1}
.stage.compact .seat:not(.dealerseat) .plate br{display:none}
.stage.compact .seat:not(.dealerseat) .plate:has(.tag){padding-bottom:9px}
.stage.compact .seat:not(.dealerseat) .me-badge{font-size:10px;top:-10px;padding:2px 9px}
.stage.compact .spot{width:56px;height:56px;margin:-28px 0 0 -28px;padding-bottom:12px}
.stage.compact .spot .ck{width:24px;height:9px}
.stage.compact .spot .ck+.ck{margin-bottom:-5px}
.stage.compact .spot .amt{font-size:11px;padding:1px 7px;bottom:-10px}
.dealerseat .card+.card{margin-left:-26px} /* long dealer hands stay clear of the deck and pool */
.card.down{transform:rotateY(180deg)}
.card.flying{z-index:20}
.face{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.card.flying .face{box-shadow:0 18px 26px rgba(0,0,0,.45)}
.front{background:#fff;color:#111}
.front.red{color:#c0392b}
.back{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,#8a2333 0 6px,#6b1a27 6px 12px);box-shadow:inset 0 0 0 3px #fff,0 4px 10px rgba(0,0,0,.4)}
.card .r{position:absolute;left:6px;top:6px}
.card .s{position:absolute;left:7px;top:28px;font-size:16px}
.big .card .s{top:32px;font-size:18px}
.card .c{position:absolute;right:6px;bottom:4px;font-size:26px}
.big .card .c{font-size:30px}
.card.ghost{border-radius:8px;border:2px dashed rgba(255,255,255,.25)}
.card.ghost+.card.ghost{margin-left:10px}
.tot{position:absolute;right:-14px;top:-12px;background:#0b1210;border:1px solid var(--gold);color:var(--gold2);font:700 14px 'Space Grotesk',sans-serif;border-radius:99px;padding:2px 8px;z-index:3}

/* ---------- bets on the felt ---------- */
.spot{position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;border:2px dashed rgba(255,255,255,.28);display:flex;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:16px;box-sizing:border-box;pointer-events:none;transition:left .9s cubic-bezier(.65,0,.35,1),top .9s cubic-bezier(.65,0,.35,1),border-color .3s,box-shadow .3s}
.spot.none{display:none}
.spot.mine{border-color:rgba(227,184,79,.7)}
.spot.allin{border-color:var(--gold);box-shadow:0 0 18px rgba(227,184,79,.45)}
.spot.won{border-color:var(--green);box-shadow:0 0 18px rgba(143,224,173,.35)}
.piles{display:flex;gap:3px;align-items:flex-end}
.pile{display:flex;flex-direction:column-reverse;align-items:center}
.ck{width:30px;height:11px;border-radius:50%;border:2px dashed rgba(255,255,255,.8);box-shadow:0 2px 0 rgba(0,0,0,.45);box-sizing:border-box;flex:none}
.ck+.ck{margin-bottom:-6px}
.k1{background:#eceff1;border-color:#9aa4ad}.k5{background:#d23b3b}.k10{background:#2f6fe0}.k25{background:#1f9a55}.k50{background:#1b1b1b;border-color:var(--gold)}
.amt{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 12px 'Space Grotesk',sans-serif;background:rgba(8,14,11,.94);border:1px solid #3a5045;color:var(--fg);border-radius:99px;padding:2px 9px}
.amt.gold{border-color:var(--gold);color:var(--gold2)}.amt.red{border-color:var(--red);color:var(--red)}.amt.green{border-color:var(--green);color:var(--green)}
.pool{position:absolute;left:652px;top:98px;width:160px;height:98px;border-radius:16px;border:2px dashed rgba(227,184,79,.45);background:rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 6px 10px;box-sizing:border-box;z-index:1;text-align:center;pointer-events:none}
.pool .kicker{font-size:11px}
.pool .pv{font:700 13px 'Space Grotesk',sans-serif;color:var(--gold2)}
.pool .pv span{font:500 12px Inter,sans-serif;color:var(--muted)}
.pool .pe{font-size:12px;color:rgba(255,255,255,.6);margin:auto 0}
.flychips{position:absolute;left:0;top:0;z-index:30;pointer-events:none;filter:drop-shadow(0 10px 10px rgba(0,0,0,.45))}
.spot.part{border-color:var(--gold);box-shadow:0 0 18px rgba(227,184,79,.35)}
.pool.broke{border-color:rgba(255,157,143,.6);background:rgba(0,0,0,.25)}
.pool.broke .kicker{color:var(--red)}

/* ---------- knocked out / bankrupt / game over ---------- */
.seat.out{opacity:.45;filter:grayscale(1)}
.seat.out.me{opacity:.7;filter:grayscale(.6)}
.tag.out{background:transparent;border:1px solid var(--muted);color:var(--muted)}
.tag.red{background:var(--red);color:#2a0a05}
.tag.champ{background:var(--gold);color:#2a1e00}
.plate.broke{border-color:var(--red);box-shadow:0 0 22px rgba(255,157,143,.3)}
.plate.champ{border:2px solid var(--gold);box-shadow:0 0 0 3px rgba(227,184,79,.3),0 0 34px rgba(227,184,79,.6)}
.banner{display:flex;align-items:center;gap:10px;background:rgba(255,157,143,.1);border:1px solid rgba(255,157,143,.5);border-radius:12px;padding:8px 12px;font-size:13px;color:#ffc2b8}
.banner b{color:var(--red)}
.dock.over{text-align:center;align-items:center;border-color:var(--gold);box-shadow:0 18px 40px rgba(0,0,0,.5),0 0 40px rgba(227,184,79,.25)}
.dock .dtitle{font:700 30px/1.1 'Space Grotesk',sans-serif}
.status.broke{border-color:rgba(255,157,143,.5)}.status.broke .kicker{color:var(--red)}
.bkt{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.bkt .how{font-size:12px;color:var(--muted);margin:4px 0 8px}
.bkt .how b{color:var(--fg)}
.bkr{display:grid;grid-template-columns:1fr 44px 44px 56px;gap:6px;align-items:center;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}
.bkr.h{border-top:0;font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:700;padding-top:0}
.bkr span:not(:first-child){text-align:right}
.bkr b{font:700 13px 'Space Grotesk',sans-serif}
.bkr.me{color:var(--gold2)}
.li .rk{width:28px;height:28px;border-radius:50%;background:#2c3d34;display:flex;align-items:center;justify-content:center;font:700 13px 'Space Grotesk',sans-serif;flex:none}
.li.champ{border-color:var(--gold);background:linear-gradient(135deg,#2a2108,#1a1406)}
.li.champ .rk{background:var(--gold);color:#2a1e00}

/* ---------- action dock (on the table) ---------- */
.dock{position:absolute;left:50%;top:0;width:400px;box-sizing:border-box;padding:14px 18px 16px;border-radius:20px;background:rgba(8,14,11,.92);border:1px solid var(--gold);box-shadow:0 18px 40px rgba(0,0,0,.5),0 0 30px rgba(227,184,79,.18);display:flex;flex-direction:column;gap:12px;z-index:8;transform-origin:top center}
.dock[hidden]{display:none}
.dock.good{border-color:var(--green);box-shadow:0 18px 40px rgba(0,0,0,.5)}
.dock.bad{border-color:var(--red);box-shadow:0 18px 40px rgba(0,0,0,.5)}
.dock .dh{display:flex;align-items:center;gap:4px 14px;flex-wrap:wrap}
.dock .dv{font:700 46px/1 'Space Grotesk',sans-serif}
.dock .dres{font:700 28px/1.1 'Space Grotesk',sans-serif;white-space:nowrap}
.dock .banner{padding:6px 10px}
.dock .act{height:64px;font-size:22px;border-radius:16px}

/* ---------- console ---------- */
aside{flex:0 0 320px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:20px;gap:14px;min-height:0}
.chead{display:flex;justify-content:space-between;align-items:center}
.chead .t{font:700 20px 'Space Grotesk',sans-serif}
.code{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line2);color:var(--gold);font:700 15px 'Space Grotesk',sans-serif;letter-spacing:.2em;padding:8px 12px;border-radius:10px}
.status{background:linear-gradient(135deg,#1d2a24,#16211c);border:1px solid var(--line2);border-radius:16px;padding:16px}
.status.hot{background:linear-gradient(135deg,#2a2108,#1a1406);border-color:var(--gold)}
.kicker{font-size:12px;letter-spacing:.12em;color:var(--gold);font-weight:700}
.big1{font:700 26px 'Space Grotesk',sans-serif;margin-top:4px}
.big2{font:700 52px/1 'Space Grotesk',sans-serif}
.sub{font-size:14px;color:var(--muted);margin-top:4px}
.bar{height:6px;border-radius:99px;background:var(--panel2);margin-top:12px;overflow:hidden}.bar>div{height:100%;background:var(--gold);transition:width .3s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.stat .l{font-size:13px;color:var(--muted)}.stat .v{font:700 24px 'Space Grotesk',sans-serif}
.stat.g{border-color:var(--gold)}.stat.g .v{color:var(--gold2)}
.chips{display:flex;justify-content:space-between;gap:6px}
.chip{width:50px;height:50px;border-radius:50%;font:700 15px 'Space Grotesk',sans-serif;color:#fff;border:5px dashed rgba(255,255,255,.85);transition:transform .1s}
.chip:active:not(:disabled){transform:translateY(3px)}
.c1{background:#eceff1;color:#1a1a1a;border-color:#9aa4ad;box-shadow:0 4px 0 #7d868e}
.c5{background:#d23b3b;box-shadow:0 4px 0 #7d1e1e}
.c10{background:#2f6fe0;box-shadow:0 4px 0 #1b418a}
.c25{background:#1f9a55;box-shadow:0 4px 0 #0f5c31}
.c50{background:#1b1b1b;color:var(--gold);border-color:var(--gold);box-shadow:0 4px 0 #000}
.row2{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.btn.allin{height:44px;background:var(--panel2);border:2px solid var(--gold);color:var(--gold2);font:700 15px 'Space Grotesk',sans-serif;letter-spacing:.08em}
.btn.allin:hover:not(:disabled){background:var(--goldbg)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{height:92px;border-radius:18px;font:700 24px 'Space Grotesk',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.act span{font:500 12px Inter,sans-serif;opacity:.75}
.act.hit{background:var(--gold);color:#1e1600;border:0;box-shadow:0 8px 22px rgba(227,184,79,.3)}
.act.hit:hover:not(:disabled){background:var(--gold2)}
.act.stand{background:#1d2a24;color:var(--fg);border:1px solid #3a5045}
.act.stand:hover:not(:disabled){background:#24342c}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:4px;gap:4px;margin-top:10px}
.seg button{height:42px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-weight:600}
.seg button.on{background:var(--gold);color:#1e1600}
.list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px}
.lh{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.li{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;font-size:14px}
.li.me{background:var(--goldbg);border-color:var(--gold)}
.li .av{width:28px;height:28px;border-radius:50%;background:#2c3d34;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.li .av.d{background:var(--gold);color:#2a1e00}
.li .n{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12px;color:var(--muted)}
.li .c{font-size:13px;color:var(--muted);min-width:40px;text-align:right}
.li .b{font:700 12px 'Space Grotesk',sans-serif;color:var(--gold2);min-width:32px;text-align:right}
.li .n small{display:block;font-weight:500;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.foot{display:flex;gap:10px}.foot .btn{height:42px;flex:1;font-weight:500;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2a1212;border:1px solid var(--red);color:var(--fg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9}

@media (max-width:860px){
  .game{flex-direction:column}
  .tablewrap{flex:1 1 52%}
  .topbar{padding:10px 14px 0}.topbar span{display:none}
  aside{flex:0 1 auto;max-height:48%;overflow:auto;border-left:0;border-top:1px solid var(--line);padding:12px 14px;gap:10px}
  .chead,.list .lh{display:none}
  .status{padding:10px 14px}.big1{font-size:20px}.big2{font-size:38px}
  .act{height:64px;font-size:20px}.chip{width:52px;height:52px;font-size:15px}
  .list{flex:none;max-height:none}
  .dock{position:relative;left:auto;width:auto;margin:6px 12px 0;padding:10px 14px 12px;gap:8px}
  .dock .dv{font-size:36px}.dock .dres{font-size:24px}.dock .act{height:56px}
}

/* ---------- phone table (portrait .mp / landscape .ml): real seats, your seat bigger ---------- */
.mside{display:contents}
.mtray[hidden]{display:none}
.mbal,.mpanel,.mclose,.mscrim{display:none}
.game.m{flex-direction:column}
.game.ml{flex-direction:row}
.game.m .tablewrap{flex:1 1 auto;min-height:0}
.game.m .stagebox{overflow:hidden}
.game.m .stage{left:0;top:0;transform-origin:top left}
.game.mp .stagebox{margin:0 8px}
.game.ml .stagebox{margin:8px;order:1}
/* header (portrait) / left rail (landscape) */
.game.m .topbar{flex:none;padding:0 12px;height:60px;align-items:center;gap:10px}
.game.m .tbl{flex:1;min-width:0;display:flex;flex-direction:column}
.game.m .topbar b{font-size:17px;margin:0}
.game.mp .tbsub{display:block;font-size:12px;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game.m .mbal{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px 0 8px;border-radius:99px;background:var(--panel);border:1px solid var(--line2);font:700 15px 'Space Grotesk',sans-serif;color:var(--fg);flex:none}
.game.m .mbal::before{content:"";width:16px;height:16px;border-radius:50%;background:#2f6fe0;border:2px dashed rgba(255,255,255,.85);box-sizing:border-box}
.game.m .mpanel{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line2);background:var(--panel);color:var(--fg);padding:0;order:9}
.game.ml .tablewrap{flex-direction:row}
.game.ml .topbar{order:0;width:60px;height:auto;flex-direction:column;justify-content:flex-start;padding:10px 8px;gap:8px;background:var(--panel);border-right:1px solid var(--line)}
.game.ml .mpanel{order:0}
.game.ml .topbar .fsb{order:1;width:44px;height:44px}
.game.ml .mbal{order:8;margin-top:auto;height:28px;padding:0 6px;font-size:12px;gap:0}
.game.ml .mbal::before{display:none}
.game.ml .tbl{order:9;flex:none;text-align:center}
.game.ml .tbsub{display:none}
.game.ml .topbar b{font-size:12px;line-height:1.2}
/* the felt fills the box */
.game.m .rail{left:0;right:0;top:0;bottom:0;height:auto}
.game.mp .rail{border-radius:30px 30px 50% 50%/30px 30px 13% 13%}
.game.mp .felt{inset:9px;border-radius:22px 22px 50% 50%/22px 22px 12% 12%}
.game.ml .rail{border-radius:18px 18px 50% 50%/18px 18px 34% 34%}
.game.ml .felt{inset:8px;border-radius:12px 12px 50% 50%/12px 12px 33% 33%}
.game.m .feltsvg,.game.m .center{display:none}
.game.m .deck{left:24px;top:30px;transform:rotate(-8deg) scale(.5);transform-origin:top left}
.game.m .deck .count{top:auto;bottom:-46px;font-size:21px}
.game.ml .deck .count{bottom:auto;top:50%;left:calc(100% + 18px);transform:translateY(-50%) rotate(8deg)} /* beside the deck, clear of the corner seats */
.game.m .pool{left:auto;right:24px;top:24px;width:64px;height:auto;min-height:74px;padding:5px 3px 6px;border-radius:14px;gap:3px}
.game.ml .pool{top:16px;min-height:66px}
.game.m .pool .kicker{font-size:9px;letter-spacing:.06em;line-height:1.15}
.game.m .pool .pv{font-size:11px;line-height:1.2}.game.m .pool .pv span{font-size:9px}
.game.m .pool .pe{font-size:10px;line-height:1.2}
.game.m .pool .ck{width:22px;height:8px}.game.m .pool .ck+.ck{margin-bottom:-4px}
/* dealer chair: a name pill over the cards */
.game.m .seat.dealerseat{width:auto;gap:8px;transform:translate(-50%,0)}
.game.ml .seat.dealerseat{gap:6px}
.game.m .dealerseat .plate{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:99px;min-width:0;white-space:nowrap}
.game.m .dealerseat .plate br,.game.m .dealerseat .ps{display:none}
.game.m .dealerseat .tag{margin:0;font-size:10px}
.game.m .dealerseat .pn{font-size:13px}.game.m .dealerseat .pc{font-size:12px}
.game.m .dealerseat .me-badge{font-size:9px;top:-10px;padding:1px 8px}
.game.m .dealerseat .hand{min-height:0}
.game.mp .dealerseat .card{width:62px;height:90px;font-size:22px}
.game.mp .dealerseat .card .s{top:30px;font-size:17px}.game.mp .dealerseat .card .c{font-size:30px}
.game.mp .dealerseat .card+.card{margin-left:-20px}
.game.mp .dealerseat.me .card{width:84px;height:120px;font-size:28px}
.game.mp .dealerseat.me .card .r{left:8px;top:8px}.game.mp .dealerseat.me .card .s{left:9px;top:38px;font-size:22px}.game.mp .dealerseat.me .card .c{right:8px;bottom:6px;font-size:40px}
.game.mp .dealerseat.me .card+.card{margin-left:-28px}
.game.ml .dealerseat .card{width:52px;height:76px;font-size:19px}
.game.ml .dealerseat .card .s{top:26px;font-size:15px}.game.ml .dealerseat .card .c{font-size:24px}
.game.ml .dealerseat .card+.card{margin-left:-16px}
.game.ml .dealerseat.me .card{width:62px;height:90px;font-size:22px}
.game.ml .dealerseat.me .card .s{top:30px;font-size:17px}.game.ml .dealerseat.me .card .c{font-size:30px}
.game.ml .dealerseat.me .card+.card{margin-left:-20px}
/* long dealer hands fan tighter so they stay on the felt */
.game.mp .dealerseat .card:nth-child(n+3){margin-left:-36px}
.game.mp .dealerseat.me .card:nth-child(n+3){margin-left:-52px}
.game.ml .dealerseat .card:nth-child(n+3){margin-left:-30px}
.game.ml .dealerseat.me .card:nth-child(n+3){margin-left:-36px}
/* seats: fixed-size tiles (sizes match mobSeats) */
.game.m .seat:not(.dealerseat){justify-content:flex-start;gap:3px;padding:7px 2px 5px;border-radius:12px;background:rgba(6,12,9,.62);border:1px solid rgba(255,255,255,.14);box-sizing:border-box}
.game.mp .seat.mini{width:58px;height:78px}.game.ml .seat.mini{width:54px;height:76px}
.game.mp .seat.mid{width:84px;height:104px}.game.ml .seat.mid{width:80px;height:100px}
.game.m .seat.mid{gap:5px;padding:10px 3px 7px;border-radius:14px}
.game.m .seat.me:not(.dealerseat){gap:6px;padding:14px 6px 8px;border-radius:16px;border:2px solid var(--gold);background:rgba(26,20,6,.92);box-shadow:0 0 0 3px rgba(227,184,79,.3),0 0 24px rgba(227,184,79,.55);z-index:3}
.game.mp .seat.me:not(.dealerseat){width:136px;height:162px}
.game.ml .seat.me:not(.dealerseat){width:116px;height:112px;padding-top:12px}
.game.m .seat.turn:not(.me):not(.dealerseat){border:2px solid var(--gold);background:rgba(26,20,6,.85);box-shadow:0 0 0 3px rgba(227,184,79,.25),0 0 18px rgba(227,184,79,.45)}
.game.m .seat:not(.dealerseat):has(.spot.allin){border-color:rgba(227,184,79,.6)}
.game.m .seat:not(.dealerseat) .plate{order:0;background:none!important;border:0!important;box-shadow:none!important;padding:0!important;min-width:0;max-width:100%;position:static}
.game.m .seat:not(.dealerseat) .ps,.game.m .seat:not(.dealerseat) .pc,.game.m .seat:not(.dealerseat) .plate br{display:none}
.game.m .seat:not(.dealerseat) .pn{font-size:11px;max-width:100%}
.game.m .seat.mini .cpu{display:none}
.game.m .seat.me:not(.dealerseat) .pn{font-size:14px}
.game.ml .seat.me:not(.dealerseat) .pn{display:none}
.game.m .seat:not(.dealerseat) .me-badge{top:-10px;font-size:10px;padding:2px 9px;z-index:2}
.game.m .seat:not(.dealerseat) .tag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:8px;padding:1px 5px;margin:0;white-space:nowrap;z-index:1}
.game.m .seat:not(.dealerseat) .tag.o,.game.m .seat:not(.dealerseat) .tag.out{background:#0d3f27}
.game.m .seat.me:not(.dealerseat) .tag{top:auto;bottom:-9px}
.game.m .seat:not(.dealerseat) .hand{order:1;min-height:0}
.game.m .seat.mini .hand{height:32px}.game.m .seat.mid .hand{height:52px}
.game.mp .seat.me:not(.dealerseat) .hand{height:90px;margin-right:10px}
.game.ml .seat.me:not(.dealerseat) .hand{height:66px;margin-right:10px}
.game.m .seat:not(.dealerseat) .spot{order:2;position:static;margin:0;width:auto;height:auto;border:0;padding:0;box-shadow:none;border-radius:0;display:flex;align-items:center;gap:5px}
.game.m .seat:not(.dealerseat) .spot.none{display:none}
.game.m .seat:not(.dealerseat) .spot .piles{display:none}
.game.m .seat.me:not(.dealerseat) .spot .piles{display:flex}
.game.m .seat:not(.dealerseat) .spot .ck{width:22px;height:9px}.game.m .seat:not(.dealerseat) .spot .ck+.ck{margin-bottom:-5px}
.game.m .seat:not(.dealerseat) .amt{position:static;transform:none;font-size:10px;padding:0 5px}
.game.m .seat.me:not(.dealerseat) .amt{font-size:12px;padding:1px 8px}
/* cards: mini (rank only), mid, and your own */
.game.m .seat.mini .card{width:22px;height:32px;font-size:10px}
.game.m .seat.mini .card+.card{margin-left:-10px}.game.m .seat.mini .card:nth-child(n+4){margin-left:-14px}
.game.m .seat.mini .card .r{left:2px;top:2px}
.game.m .seat.mini .card .s,.game.m .seat.mini .card .c{display:none}
.game.m .seat.mini .face{border-radius:4px}
.game.m .seat.mini .back{box-shadow:inset 0 0 0 2px #fff,0 2px 4px rgba(0,0,0,.4)}
.game.m .seat.mini .tot{font-size:10px;padding:0 4px;right:-12px;top:-6px}
.game.m .seat.mid .card{width:36px;height:52px;font-size:14px}
.game.m .seat.mid .card+.card{margin-left:-17px}.game.m .seat.mid .card:nth-child(n+4){margin-left:-22px}
.game.m .seat.mid .card .r{left:4px;top:4px}.game.m .seat.mid .card .s{display:none}.game.m .seat.mid .card .c{right:4px;bottom:3px;font-size:18px}
.game.m .seat.mid .face{border-radius:6px}
.game.m .seat.mid .back{box-shadow:inset 0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.4)}
.game.m .seat.mid .tot{font-size:11px;padding:1px 5px;right:-9px;top:-8px}
.game.mp .seat.me:not(.dealerseat) .card{width:62px;height:90px;font-size:22px}
.game.mp .seat.me:not(.dealerseat) .card .s{top:30px;font-size:17px}.game.mp .seat.me:not(.dealerseat) .card .c{font-size:30px}
.game.mp .seat.me:not(.dealerseat) .card+.card{margin-left:-20px}.game.mp .seat.me:not(.dealerseat) .card:nth-child(n+3){margin-left:-40px}
.game.ml .seat.me:not(.dealerseat) .card{width:46px;height:66px;font-size:17px}
.game.ml .seat.me:not(.dealerseat) .card .r{left:5px;top:5px}.game.ml .seat.me:not(.dealerseat) .card .s{left:6px;top:22px;font-size:13px}.game.ml .seat.me:not(.dealerseat) .card .c{right:5px;bottom:3px;font-size:22px}
.game.ml .seat.me:not(.dealerseat) .card+.card{margin-left:-14px}.game.ml .seat.me:not(.dealerseat) .card:nth-child(n+3){margin-left:-30px}
.game.m .seat.me:not(.dealerseat) .tot{font-size:15px;padding:2px 8px}
/* controls tray: bottom (portrait) or right column (landscape) */
.game.m .mside{display:flex;flex-direction:column;gap:10px;flex:none;background:var(--panel);overflow:auto}
.game.mp .mside{margin-top:10px;max-height:56%;padding:12px 14px 14px;border-top:1px solid var(--gold);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(227,184,79,.12)}
.game.ml .mside{order:2;width:200px;padding:12px;border-left:1px solid var(--gold)}
.game.m .mside:has(.dock.good){border-color:var(--green)}
.game.m .mside:has(.dock.bad){border-color:var(--red)}
.game.m .dock{position:static;width:auto;margin:0;padding:0;border:0;background:none;box-shadow:none;transform:none!important;top:auto!important;gap:10px}
.game.m .dock .dv{font-size:40px}.game.m .dock .dres{font-size:24px}
.game.m .dock .act{height:60px;font-size:22px}
.game.ml .dock{flex:1}
.game.ml .dock .dv{font-size:36px}
.game.ml .dock .acts{flex:1;grid-template-columns:1fr;grid-auto-rows:1fr}
.game.ml .dock .act{height:auto;min-height:64px}
.game.m .mtray{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.game.m .mtray[hidden]{display:none}
.game.m .mtray>*{grid-column:1/-1}

</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const CH=[1,5,10,25,50];
const val=h=>{let t=0,a=0;for(const c of h){const r=c.slice(0,-1);if(r==="A"){a++;t+=11}else if("JQK".includes(r))t+=10;else t+=+r}while(t>21&&a){t-=10;a--}return t};
let pid=ls.get("bj-pid");if(!pid){pid=Math.random().toString(36).slice(2)+Date.now().toString(36);ls.set("bj-pid",pid)}
let ws,S=null,err="",joined=false,want=null,shell=false,prevHands={},toastT;
// chip motion: last seen per-player state (to animate only live transitions), held balances, end-of-round sweep
let prevP={},prevPhase=null,hold=null,sweep=null;

/* ---------- connection ---------- */
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function connect(){
  const sock=ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws?code="+want.code);
  sock.onopen=()=>send({t:"join",pid,name:want.name,create:want.create&&!joined,start:want.start,solo:want.solo,total:want.total});
  sock.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.t==="error"){err=m.msg;joined=false;want=null;S=null;ls.del("bj-code");render()}
    else if(m.t==="state"){S=m;S.off=false;joined=true;err="";ls.set("bj-code",want.code);ls.set("bj-name",want.name);render()}};
  sock.onclose=()=>{if(sock===ws&&joined&&want){if(S){S.off=true;renderConsole()}setTimeout(()=>{if(want)connect()},1500)}};
}
function enter(code,create,name,start,total){
  code=code.toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(!name){step="home";err="Enter your name first.";return render()}
  if(!code){err="Enter the lobby code.";return render()}
  err="";want={code,name,create,start,solo:!!total,total};connect();
}
function leave(){step="home";panel=false;joined=false;want=null;S=null;shell=false;prevHands={};prevP={};prevPhase=null;hold=null;sweep=null;ls.del("bj-code");if(ws)ws.close();render()}
setInterval(()=>send({t:"ping"}),25000);
function toast(msg){clearTimeout(toastT);let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t)}t.textContent=msg;toastT=setTimeout(()=>t.remove(),2500)}

/* ---------- helpers ---------- */
const P=id=>S.players.find(p=>p.id===id);
const nameOf=id=>(P(id)||{}).name||"Player";
const dealerId=()=>S.dealer||(S.players[0]||{}).id;
// Seats sit on an elliptical curve around the table, evenly spaced by distance along it. With many
// players the curve continues up the sides past 90° into the space beside the dealer (the deck lives
// on the dealer's left to leave room). Spacing was measured so nothing overlaps for 2–10 players:
// full-size seats up to 5 players (spread over up to 925px of curve), compact seats from 6
// (see .stage.compact). Compact tables spread
// as wide as a 10-player table (1450px of curve) so 7–9 players get extra room.
const compactFor=m=>m+1>=6;
const layouts={};
function seatLayout(m){
  if(layouts[m])return layouts[m];
  const c=compactFor(m),S=c?Math.min(200,1450/(m-1)):Math.min(230,925/Math.max(1,m-1)),maxDeg=c?130:120,rx=440,ry=340,pts=[],cum=[0];
  for(let d=-maxDeg;d<=maxDeg+1e-9;d+=.25){const t=d*Math.PI/180;pts.push({x:500+rx*Math.sin(t),y:300+ry*Math.cos(t)})}
  for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));
  const total=cum[cum.length-1],L=Math.min(total,S*(m-1)),start=(total-L)/2,out=[];
  for(let k=0;k<m;k++){const s=m<=1?total/2:start+L*k/(m-1);let i=cum.findIndex(v=>v>=s);if(i<0)i=pts.length-1;out.push({x:+pts[i].x.toFixed(1),y:+pts[i].y.toFixed(1),d:false})}
  return layouts[m]=out.reverse(); // k=1 is the dealer's left = screen right, then clockwise
}
function seatPos(k,m){
  if(k===0)return{x:500,y:112,d:true};
  return seatLayout(m)[k-1];
}
const sign=n=>(n>0?"+":n<0?"−":"")+Math.abs(n);
// balances stay as they were until the end-of-round chip sweep lands
const dispChips=p=>hold&&hold.round===S.round&&S.phase==="results"&&Date.now()<hold.until&&hold.m[p.id]!=null?hold.m[p.id]:p.chips;
const swept=()=>!sweep||sweep.round!==S.round||Date.now()>=sweep.at;
const DEN=[50,25,10,5,1];
function pilesHTML(n,max,k){
  if(!(n>0))return"";
  const out=[];let r=n;
  for(const d of DEN){const c=Math.floor(r/d);if(c){out.push([d,c]);r-=c*d}}
  return`<div class="piles" data-k="${k||"bet"}">${out.slice(0,max||2).map(([d,c])=>`<div class="pile">${`<div class="ck k${d}"></div>`.repeat(Math.min(c,6))}</div>`).join("")}</div>`;
}
// bet spot sits between the seat and the table centre
// (distance grows with the seat's real size so the chips never sit on the cards or the total badge)
function spotOff(pos,seat){
  const dx=500-pos.x,dy=330-pos.y,l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l;
  const hw=Math.max(seat.children[0].offsetWidth,seat.children[1].offsetWidth)/2,hh=seat.offsetHeight/2;
  const D=Math.min(230,Math.abs(uy)*hh+Math.abs(ux)*hw+($("#stage").classList.contains("compact")?46:66));
  return{x:ux*D,y:uy*D};
}
function spotState(p,isD){
  if(isD||S.phase==="lobby"||isOut(p))return null;
  const allin=p.bet>0&&p.bet>=p.chips;
  if(S.phase==="betting"){
    if(!p.online||p.chips<1)return null;
    if(!p.bet)return{a:0,pill:"",pc:"",cls:""};
    return{a:p.bet,pill:allin?`ALL IN ${p.bet}`:`${p.bet}${p.ready?" ✓":""}`,pc:allin?"gold":p.ready?"green":"",cls:allin?"allin":""};
  }
  if(!p.in)return null;
  if(S.phase==="playing"){
    if(p.status==="bust")return{a:0,pill:`Bust −${p.bet}`,pc:"red",cls:""};
    return{a:p.bet,pill:allin?`ALL IN ${p.bet}`:`${p.bet}`,pc:allin?"gold":"",cls:allin?"allin":""};
  }
  const r=p.res;if(!r)return null;const done=swept();
  if(r.dl<0)return{a:0,pill:`${r.o} −${-r.dl}`,pc:"red",cls:""};
  if(r.dl>0)return{a:done?0:p.bet,b:done?0:r.dl,pill:resText(r),pc:r.owed?"gold":"green",cls:r.owed?"part":"won"};
  return{a:done?0:p.bet,pill:"Push",pc:"",cls:""};
}
function spotHTML(s){
  if(!s)return"";
  const both=s.a>0&&s.b>0;
  return pilesHTML(s.a,both?1:2,"bet")+pilesHTML(s.b,both?1:2,"pay")+(s.pill?`<span class="amt ${s.pc}">${esc(s.pill)}</span>`:"");
}
// fly a copy of some chips across the stage (stage coordinates, so it works at any scale)
function flyChips(html,fromEl,toEl,delay,dur){
  if(calm()||!html||!fromEl||!toEl)return 0;
  dur=dur||650;
  const a=stagePt(fromEl),b=stagePt(toEl),f=document.createElement("div");
  f.className="flychips";f.innerHTML=html;$("#stage").appendChild(f);
  f.style.left=(a.x-f.offsetWidth/2)+"px";f.style.top=(a.y-f.offsetHeight/2)+"px";
  const dx=b.x-a.x,dy=b.y-a.y;
  f.animate([
    {transform:"translate(0,0) scale(1)",opacity:1},
    {transform:`translate(${dx*.5}px,${dy*.5-40}px) scale(1.12)`,opacity:1,offset:.5},
    {transform:`translate(${dx}px,${dy}px) scale(.92)`,opacity:1,offset:.9},
    {transform:`translate(${dx}px,${dy}px) scale(.92)`,opacity:0}
  ],{duration:dur,delay,easing:"cubic-bezier(.45,0,.25,1)",fill:"both"}).onfinish=()=>f.remove();
  return delay+dur;
}
const appearAt=(el,t)=>{if(el&&t>0&&!calm())el.animate([{opacity:0},{opacity:1}],{duration:150,delay:t,fill:"backwards"})};
function cardHTML(c){
  if(c===null)return`<div class="card down"><div class="face front"></div><div class="face back"></div></div>`;
  const r=c.slice(0,-1),s=c.slice(-1),red=s==="♥"||s==="♦";
  return`<div class="card"><div class="face front ${red?"red":""}"><span class="r">${r}</span><span class="s">${s}</span><span class="c">${s}</span></div><div class="face back"></div></div>`;
}

/* ---------- deck & card motion ---------- */
let deckGen=0,deckUntil=0,rotateUntil=0;
const calm=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const stageScale=()=>$("#stage").getBoundingClientRect().width/STW;
function renderDeck(n){
  const L=$("#layers");if(!L)return;
  const layers=n>0?Math.max(1,Math.min(13,Math.ceil(n/4))):0;
  if(L.childElementCount!==layers)L.innerHTML=Array.from({length:layers},(_,i)=>`<div class="layer" style="transform:translate(${-i*.4}px,${-i*1.1}px)"></div>`).join("");
  $("#dcount").textContent=`${n} CARDS`;
}
function stagePt(el){ // centre of an element, in unscaled stage coordinates
  const r=el.getBoundingClientRect(),st=$("#stage").getBoundingClientRect(),s=stageScale();
  return{x:(r.left+r.width/2-st.left)/s,y:(r.top+r.height/2-st.top)/s};
}
function flyFromDeck(el,delay,up){
  const from=stagePt($("#layers").lastElementChild||$("#deckpile")),to=stagePt(el);
  const dx=from.x-to.x,dy=from.y-to.y,end=up?"rotateY(0deg)":"rotateY(180deg)";
  const seat=el.closest(".seat");
  el.classList.add("flying");seat.style.zIndex=5; // fly over neighbouring seats
  el.animate([
    {transform:`translate(${dx}px,${dy}px) rotate(-8deg) rotateY(180deg) scale(1)`,offset:0},
    {transform:`translate(${dx}px,${dy-14}px) rotate(-8deg) rotateY(180deg) scale(1.06)`,offset:.12},
    {transform:`translate(${dx*.45}px,${dy*.45-40}px) rotate(-3deg) rotateY(${up?90:180}deg) scale(1.1)`,offset:.55},
    {transform:`translate(0,0) rotate(0deg) ${end} scale(1)`,offset:1}
  ],{duration:520,delay,easing:"cubic-bezier(.3,.7,.25,1)",fill:"backwards"}).onfinish=()=>{el.classList.remove("flying");if(!seat.querySelector(".flying"))seat.style.zIndex=""};
}
// knocked out = 0 chips. In the round they went out we still show their result first.
const isOut=p=>p.outRound!=null&&(S.phase!=="results"||!!S.winner||p.outRound<S.round);
// game over shows once this round's chips have been swept in
const gameOver=()=>S.phase==="results"&&!!S.winner&&swept();
const resText=r=>r.owed?`${r.o} +${r.dl} of ${r.owed}`:`${r.o} ${r.dl?sign(r.dl):""}`.trim();
const resCls=r=>r.owed?"goldt":r.dl>0?"win":r.dl<0?"lose":"";
function seatStatus(p){
  const d=p.id===S.dealer;
  if(S.phase==="lobby")return{t:p.id===S.host?"Host":"Ready",c:""};
  if(gameOver())return p.id===S.winner?{t:"Last player with chips",c:"goldt"}:{t:p.outRound!=null?`Out in round ${p.outRound}`:"Out",c:""};
  if(S.phase==="results"&&p.res){
    if(d)return p.res.bankrupt?{t:"Bankrupt · knocked out",c:"lose"}:{t:`Round ${sign(p.res.dl)}`,c:p.res.dl>0?"win":p.res.dl<0?"lose":""};
    return{t:resText(p.res),c:resCls(p.res)};
  }
  if(isOut(p))return{t:"Knocked out · watching",c:""};
  if(d){
    if(S.phase==="betting")return{t:"Waiting for bets",c:""};
    if(S.turn===p.id)return{t:"Playing…",c:"goldt"};
    return{t:p.revealed?"":"Plays last",c:""};
  }
  if(S.phase==="betting"){
    if(!p.online)return{t:"Away",c:""};
    if(p.chips<1)return{t:"Out of chips",c:"lose"};
    if(p.ready)return{t:p.bet>=p.chips?"All in · locked":`Bet locked · ${p.bet}`,c:"win"};
    if(p.bet&&p.bet>=p.chips)return{t:`All in · ${p.bet}`,c:"goldt"};
    return{t:p.bet?`Betting · ${p.bet}`:"Choosing bet…",c:"goldt"};
  }
  if(!p.in)return{t:"Sits out",c:""};
  if(S.turn===p.id)return{t:`Playing · bet ${p.bet}`,c:"goldt"};
  const m={bust:["Bust","lose"],bj:["Blackjack!","win"],stand:["Stands","" ],wait:[`Waiting · bet ${p.bet}`,""]}[p.status]||["",""];
  return{t:m[0],c:m[1]};
}

/* ---------- render ---------- */
function render(){

  applyMode();
  beginSettle();
  renderConsole();renderDock();fit();renderTable(); // stage must be scaled (and the dock sized) before positions are measured
}
// the home page: your name once (step 1), then one of two paths (step 2): create or join

const CHIPS=[100,250,500,1000,5000];

};

// The felt fills the screen at real size (scaled down only below a minimum, see fit) and seats sit

// Seats follow a U (portrait: down the right, along the bottom, up the left) or an ellipse (landscape),
// spaced by real tile size; any pair that still touches gets more room, taken from the other gaps.
function mobLayout(P,W,H,dims,ytop){
  const n=dims.length;if(!n)return[];
  const ref=dims.find(d=>!d.me)||dims[0],pts=[];
  if(P){
    const y0=ytop+ref.h/2,xr=W-6-ref.w/2,xl=6+ref.w/2,r=Math.min(100,W*.28),yb=H-74,yc=Math.max(y0,yb-r);
    for(let y=y0;y<=yc;y+=2)pts.push([xr,y]);
    for(let a=0;a<=90;a+=3){const t=a*Math.PI/180;pts.push([xr-r+r*Math.cos(t),yc+r*Math.sin(t)])}
    for(let x=xr-r;x>=xl+r;x-=2)pts.push([x,yc+r]);
    for(let a=90;a<=180;a+=3){const t=a*Math.PI/180;pts.push([xl+r+r*Math.cos(t),yc+r*Math.sin(t)])}
    for(let y=yc;y>=y0;y-=2)pts.push([xl,y]);

    for(let a=-4;a<=184;a++){const t=a*Math.PI/180;pts.push([cx+rx*Math.cos(t),cy+ry*Math.sin(t)])}

  for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const L=cum[cum.length-1];

    const p0=pts[i-1],p1=pts[i],d=Math.hypot(p1[0]-p0[0],p1[1]-p0[1])||1,f=Math.min(1,Math.max(0,(s-cum[i-1])/d));

  const place=s=>s.map((sv,i)=>{const z=dims[i],p=at(Math.max(0,Math.min(L,sv)));

  const sOf=g=>{const sum=g.reduce((a,b)=>a+b,0),tot=Math.min(L,sum),s=[(L-tot)/2];g.forEach((v,i)=>s.push(s[i]+v*tot/sum));return s};
  let s=sOf(g);
  for(let it=0;it<300;it++){
    const b=place(s);let moved=false;
    for(let i=0;i<n-1;i++){const A=b[i],B=b[i+1];
      const px=Math.min(A.x+A.w,B.x+B.w)-Math.max(A.x,B.x)+6,py=Math.min(A.y+A.h,B.y+B.h)-Math.max(A.y,B.y)+6;
      if(px>0&&py>0){g[i]+=Math.min(px,py)*.5+1;moved=true}}
    if(!moved)break;
    const tot=g.reduce((a,b)=>a+b,0);if(tot>L)g=g.map(v=>v*L/tot);

  }

}

function mobSeats(n,di){

function fit(){

    const mn=scr==="p"?(cp?[350,580]:[320,440]):(cp?[560,350]:[460,300]);
    const s=Math.min(1,(bw-2*D.rp)/mn[0],(bh-2*D.rp)/mn[1]);

    const d=$("#dock");if(d){d.style.top="";d.style.transform=""}

  }

  if(busts.length){
    let end=0;busts.forEach((b,i)=>{end=Math.max(end,flyChips(pilesHTML(b.bet,2),b.spot,pool,dealt+250+i*150))});
    if(!poolHad)appearAt(pool.querySelector(".piles"),end);
  }
  // round settled: losses go to the pool, then the dealer pays each winner, then everything is swept in
  if(settling){
    settling=false;
    const base=dealt+600;let end=0;
    losers.forEach((x,i)=>{end=Math.max(end,flyChips(pilesHTML(x.bet,2),x.spot,pool,base+i*150))});
    if(losers.length&&!poolHad)appearAt(pool.querySelector(".piles"),end);
    const payAt=base+(losers.length?losers.length*150+350:0);end=Math.max(end,payAt);
    winners.forEach((x,i)=>{const t=flyChips(pilesHTML(x.dl,2,"pay"),pool,x.spot,payAt+i*150);appearAt(x.spot.querySelector('[data-k="pay"]'),t);end=Math.max(end,t)});
    const sweepT=end+1500,r=S.round;
    hold.until=sweep.at=Date.now()+sweepT+640;
    setTimeout(()=>sweepChips(r),sweepT);
  }
  prevPhase=S.phase;
  ps.forEach(p=>{prevP[p.id]={round:S.round,phase:S.phase,status:p.status,chips:p.chips}});
  const c=$("#center");
  if(S.phase==="lobby")c.innerHTML=S.solo?`Your private table<small>Press Start game when you’re ready</small>`:`Waiting for players<small>The host starts when everyone has joined</small>`;
  else if(S.phase==="betting"){const outs=S.players.filter(isOut);c.innerHTML=`Place your bets<small>${esc(nameOf(S.dealer))} is dealing${outs.length===1?` · ${esc(outs[0].name)} is out of chips and sits this one out`:outs.length?` · ${outs.length} players are out of chips`:""}</small>`}
  else if(S.phase==="playing")c.innerHTML=S.turn===S.me?`Your turn`:`${esc(nameOf(S.turn))}’s turn<small>${S.turn===S.dealer?"Dealer plays last":"Cards flip as each turn starts"}</small>`;
  else c.innerHTML=`Round over<small>${esc(nameOf(S.next))} moves into the dealer chair next</small>`;
}
// end of round: winners' chips go back to their plate, the pool goes to the dealer, then balances update
function sweepChips(r){
  if(!S||S.round!==r||S.phase!=="results")return;
  document.querySelectorAll("#seats .seat").forEach(el=>{
    const sp=el.children[2],pl=[...sp.querySelectorAll(".piles")];if(!pl.length)return;
    flyChips(`<div class="piles">${pl.map(x=>x.innerHTML).join("")}</div>`,sp,el.children[1],0,600);
    pl.forEach(x=>x.style.visibility="hidden");
  });
  const pp=$("#pool .piles"),dp=$(`#seats .seat[data-id="${S.dealer}"] .plate`);
  if(pp&&dp&&!S.share)flyChips(pp.outerHTML,$("#pool"),dp,0,600); // a bankrupt dealer's bank was all paid out
  if(pp)pp.style.visibility="hidden";
  setTimeout(()=>{if(S)render()},660);
}
// called before anything renders, so the held balances apply to the panel and the plates alike
let settling=false;
function beginSettle(){
  settling=false;
  if(prevPhase!=="playing"||S.phase!=="results"||calm())return;
  if(!Object.values(prevP).some(x=>x.round===S.round))return;
  const m={};S.players.forEach(p=>{const x=prevP[p.id];if(x&&x.round===S.round)m[p.id]=x.chips});
  hold={round:S.round,until:Infinity,m};sweep={round:S.round,at:Infinity};settling=true;
}
function renderPool(){
  const el=$("#pool");
  if(S.phase==="lobby"){el.style.display="none";return}
  el.style.display="";
  let h;
  if(S.phase==="playing"){
    const bs=S.players.filter(p=>p.in&&p.id!==S.dealer&&p.status==="bust"),sum=bs.reduce((a,p)=>a+p.bet,0);
    h=sum?`<div class="kicker">DEALER POOL</div>${pilesHTML(sum,3,"pool")}<div class="pv">${sum} <span>from ${bs.length===1?esc(bs[0].name):bs.length+" busts"}</span></div>`
      :`<div class="kicker">DEALER POOL</div><div class="pe">Lost bets slide here</div>`;
  }else if(S.phase==="results"&&S.share){
    const sh=S.share,done=swept();
    h=`<div class="kicker">BANK SHARED OUT</div>${done?`<div class="pe">Dealer is out of chips</div>`:pilesHTML(sh.bank,3,"pool")}
      <div class="pv">${sh.bank} <span>= ${sh.dealerChips} chips + ${sh.lost} lost</span></div>`;
  }else if(S.phase==="results"){
    const ps=S.players.filter(p=>p.in&&p.res&&p.id!==S.dealer);
    const lost=ps.reduce((a,p)=>a+(p.res.dl<0?-p.res.dl:0),0),paid=ps.reduce((a,p)=>a+(p.res.dl>0?p.res.dl:0),0),done=swept();
    h=`<div class="kicker">${paid&&!done?"DEALER PAYS OUT":"DEALER POOL"}</div>${done?`<div class="pe">Round settled</div>`:pilesHTML(lost,3,"pool")}
      <div class="pv">${lost} <span>won</span>${paid?` · ${paid} <span>paid</span>`:""}</div>`;
  }else h=`<div class="kicker">DEALER POOL</div><div class="pe">Lost bets slide here</div>`;
  el.classList.toggle("broke",S.phase==="results"&&!!S.share);
  el.style.visibility=gameOver()?"hidden":"";
  if(el._h!==h){el.innerHTML=h;el._h=h}
}
// the dock on the felt: Hit/Stand on your turn, the result and "Deal next round" at the end
function renderDock(){
  const d=$("#dock");if(!d)return;
  const me=P(S.me)||{},amD=S.dealer===S.me;let h="",cls="";
  if(S.phase==="playing"&&S.turn===S.me){
    const v=val(me.hand),dl=P(S.dealer),up=!amD&&dl&&dl.hand[0]?dl.hand[0]:null;
    h=`<div class="dh"><div class="dv">${v}</div><div><div class="kicker">YOUR TURN</div>
      <div class="sub" style="margin:0">${amD?"Dealer hand · you must hit until 17":`vs dealer <b style="color:var(--fg)">${up?val([up]):"?"}</b>${up?"":" (face down)"} · bet ${me.bet}`}</div></div></div>
      <div class="acts"><button class="act hit" id="hit">HIT<span>Take a card · H</span></button>
      <button class="act stand" id="stand" ${amD&&v<17?"disabled":""}>STAND<span>Keep ${v} · S</span></button></div>`;
  }else if(gameOver()){
    const w=P(S.winner),host=S.host===S.me;
    cls="over";
    h=`<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#e3b84f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/></svg>
      <div class="kicker">GAME OVER</div>
      <div class="dtitle">${w?(w.id===S.me?"You win the table":`${esc(w.name)} wins the table`):"Nobody has chips left"}</div>
      <div class="sub" style="margin:0">Everyone else is out of chips${w?` · ${w.chips} chips after ${S.round} round${S.round===1?"":"s"}`:""}</div>
      ${host?`<button class="btn gold w" id="greset">Reset game · everyone back to ${S.start}</button>`:`<div class="sub" style="margin:0">Waiting for the host to reset</div>`}`;
  }else if(S.phase==="results"){
    const r=me.res,dp=P(S.dealer),dv=dp?val(dp.hand):0,sh=S.share;
    const head=!dp?"":dv>21?` · DEALER BUSTS WITH ${dv}`:dp.status==="bj"?" · DEALER HAS BLACKJACK":` · DEALER HAS ${dv}`;
    let title="You sat out";
    if(r)title=amD?(r.bankrupt?"You went bankrupt":`Dealer ${sign(r.dl)}`):r.owed?`You win +${r.dl} of ${r.owed}`:r.o==="Win"?`You win ${sign(r.dl)}`:r.o==="Lose"?`You lose ${sign(r.dl)}`:r.o==="Push"?"Push":`${r.o} ${sign(r.dl)}`;
    cls=r?(r.owed?"":r.dl>0?"good":r.dl<0||r.bankrupt?"bad":""):"";
    h=`<div class="kicker">ROUND OVER${esc(head)}</div>
      ${sh?`<div class="banner"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff9d8f" stroke-width="2" aria-hidden="true"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><span><b>Dealer is bankrupt.</b> Payouts were shared.</span></div>`:""}
      <div class="dh"><div class="dres ${r?(r.owed?"goldt":r.dl>0?"win":r.dl<0||r.bankrupt?"lose":""):""}">${esc(title)}</div>
      ${r?`<div class="sub" style="margin:0">Balance ${me.chips-r.dl} → ${me.chips}</div>`:""}</div>
      ${S.winner?`<div class="sub" style="margin:0;text-align:center">Only one player has chips left…</div>`:`<button class="btn gold w" id="next" ${S.next?"":"disabled"}>${S.next?`Deal next round · ${esc(nameOf(S.next))} deals`:"Waiting for players"}</button>`}`;
  }
  d.hidden=!h;d.className=`dock ${cls}`;
  if(d._h!==h){d.innerHTML=h;d._h=h}
  const mt=$("#mtray");if(mt)mt.hidden=!scr||!!h; // phones: the dock takes over the tray when it has something
  $("#center").style.visibility=h?"hidden":"";
  const on=(id,f)=>{const e=d.querySelector("#"+id);if(e)e.onclick=f};
  on("hit",()=>send({t:"hit"}));on("stand",()=>send({t:"stand"}));on("next",()=>send({t:"next"}));
  on("greset",()=>send({t:"reset"}));
}

function standingsHTML(){
  // winner first, then whoever lasted longest
  const ord=[...S.players].sort((a,b)=>(b.id===S.winner)-(a.id===S.winner)||(b.outRound??1e9)-(a.outRound??1e9)||b.chips-a.chips);
  return`<div class="lh">FINAL STANDINGS</div>`+ord.map((p,i)=>{
    const champ=p.id===S.winner;
    return`<div class="li ${champ?"champ":""} ${p.id===S.me?"me":""}"><div class="rk">${i+1}</div>
    <div class="n">${esc(p.name)}${p.id===S.me?" (you)":""}<small class="${champ?"goldt":""}">${champ?"Winner":p.outRound!=null?`Out in round ${p.outRound}`:"Still had chips"}</small></div>
    <span class="c" style="font:700 14px 'Space Grotesk',sans-serif;${champ?"color:var(--gold2)":""}">${p.chips}</span></div>`}).join("");
}
function listHTML(){
  if(gameOver())return standingsHTML();
  const did=dealerId(),ps=S.players,n=ps.length,di=Math.max(0,ps.findIndex(p=>p.id===did));
  const ord=[...Array(n)].map((_,k)=>ps[(di+k)%n]);
  return`<div class="lh">AT THE TABLE · CLOCKWISE</div>`+ord.map(p=>{
    const st=seatStatus(p),isD=p.id===did;
    const tag=isD&&S.phase==="results"&&p.res&&p.res.bankrupt?`<span class="tag red" style="margin:0">BANKRUPT</span>`:
      isD?`<span class="tag" style="margin:0">DEALER</span>`:isOut(p)?`<span class="tag out" style="margin:0">OUT</span>`:
      p.id===S.next?`<span class="tag o" style="margin:0">NEXT</span>`:"";
    let bet="",bc="";
    if(S.phase==="results"&&p.res&&!isD){bet=p.res.dl?sign(p.res.dl):"0";bc=resCls(p.res)}
    else if(S.phase==="results"&&p.res&&isD){bet=sign(p.res.dl);bc=p.res.dl>0?"win":p.res.dl<0?"lose":""}
    else if((S.phase==="betting"||p.in)&&p.bet&&!isD)bet=p.bet;
    return`<div class="li ${p.id===S.me?"me":""}" style="${p.online&&!isOut(p)?"":"opacity:.5"}"><div class="av ${isD?"d":""}">${esc(p.name[0]||"?")}</div>
    <div class="n">${esc(p.name)}${p.id===S.me?" (you)":""}${p.bot?`<span class="cpu">CPU</span>`:""}${st.t?`<small class="${st.c}">${esc(st.t)}</small>`:""}</div>${tag}<span class="b ${bc}">${bet}</span><span class="c">${dispChips(p)}</span></div>`}).join("");
}
// bankrupt round: show how the bank was shared (same rule as the server's Table.share)
function shareHTML(sh){
  const n=sh.rows.length,half=Math.floor(sh.bank/2),each=Math.max(1,Math.floor(half/n));
  const how=sh.bank<n?`Not enough chips for everyone: <b>1 chip each</b>, best hand first`
    :`1 · Half (${half}) split equally: <b>${each} each</b><br>2 · The rest by best hand; ties split equally`;
  const rows=[...sh.rows].sort((a,b)=>b.rank-a.rank);
  return`<div class="bkt"><div class="kicker">HOW THE ${sh.bank} WAS SHARED</div><div class="how">${how}</div>
    <div class="bkr h"><span>PLAYER</span><span>HAND</span><span>OWED</span><span>PAID</span></div>
    ${rows.map(w=>`<div class="bkr ${w.id===S.me?"me":""}"><span>${esc(nameOf(w.id))}${w.id===S.me?" (you)":""}</span><span>${w.rank===22?"BJ":w.rank}</span><span>${w.owed}</span>
    <span><b class="${w.paid>=w.owed?"win":"goldt"}">${w.paid}</b></span></div>`).join("")}</div>`;
}
function renderConsole(){
  const me=P(S.me)||{},host=S.host===S.me,amD=S.dealer===S.me;
  const stats=(l2,v2,c2)=>`<div class="stats"><div class="stat"><div class="l">Balance</div><div class="v">${dispChips(me)}</div></div><div class="stat ${c2||"g"}"><div class="l">${l2}</div><div class="v">${v2}</div></div></div>`;
  let main="";
  if(S.phase==="lobby"){
    const on=S.players.filter(p=>p.online).length;
    if(S.solo)main=`<div class="status"><div class="kicker">PRIVATE TABLE · VS COMPUTER</div><div class="big1">You + ${S.players.length-1} computer${S.players.length>2?"s":""}</div>
    <div class="sub">Starting chips: ${S.start} each · the dealer chair passes to the computers too</div></div>
    <button class="btn gold w" id="start">Start game</button>`;
    else main=`<div class="status"><div class="kicker">LOBBY</div><div class="big1">Share code <span style="color:var(--gold);letter-spacing:.15em">${esc(want?.code)}</span></div>
    <div class="sub">Starting chips: ${S.start} each · ${on} player${on===1?"":"s"} here</div></div>
    ${host?`<button class="btn gold w" id="start" ${on<2?"disabled":""}>${on<2?"Waiting for a 2nd player…":"Start game"}</button>`:`<div class="sub">Waiting for the host to start…</div>`}`;
  }else if(S.phase==="betting"&&amD){
    const b=S.players.filter(p=>p.online&&p.id!==S.dealer&&p.chips>=1),r=b.filter(p=>p.ready).length;
    main=`<div class="status hot"><div class="kicker">ROUND ${S.round} · YOU’RE THE DEALER</div><div class="big1">Waiting for bets</div>
    <div class="sub">${r} of ${b.length} bets locked${S.msg?" · "+esc(S.msg):""}</div><div class="bar"><div style="width:${b.length?100*r/b.length:0}%"></div></div></div>
    <div class="card-p" style="padding:14px"><div style="font-weight:600">Your first card</div><div class="sub" style="margin:0">Should players see it while they play?</div>
    <div class="seg"><button id="fd" class="${S.showFirst?"":"on"}">Face down</button><button id="fu" class="${S.showFirst?"on":""}">Face up</button></div></div>`;
  }else if(S.phase==="betting"){
    const locked=me.ready,left=me.chips-me.bet,b=S.players.filter(p=>p.online&&p.id!==S.dealer&&p.chips>=1),r=b.filter(p=>p.ready).length;
    const allin=me.bet>0&&me.bet>=me.chips;
    if(me.chips<1)main=`<div class="status"><div class="kicker">ROUND ${S.round} · BETTING</div><div class="big1">You’re knocked out</div><div class="sub">You’re out of chips, so you watch from here. The host can reset the game.</div></div>`;
    else main=`<div class="status ${locked?"":"hot"}"><div class="kicker">ROUND ${S.round} · BETTING</div><div class="big1">${locked?(allin?"All in · locked":"Bet locked"):"Place your bet"}</div>
    <div class="sub">${esc(nameOf(S.dealer))} is dealing · ${r} of ${b.length} bets locked</div><div class="bar"><div style="width:${b.length?100*r/b.length:0}%"></div></div></div>
    ${stats(allin?"All in":"Current bet",me.bet)}
    ${locked?`<div class="sub">Cards are dealt face down once everyone locks in. Your card flips when your turn comes.</div>`:`
    <div class="chips">${CH.map(v=>`<button class="chip c${v}" data-bet="${v}" aria-label="Add ${v}" ${v>left?"disabled":""}>${v}</button>`).join("")}</div>
    <button class="btn allin w" id="allin" ${allin?"disabled":""}>ALL IN · ${me.chips}</button>
    <div class="row2"><button class="btn ghost" id="clear" ${me.bet?"":"disabled"}>Clear</button><button class="btn gold" id="ready" ${me.bet?"":"disabled"}>Lock bet${me.bet?" · "+me.bet:""}</button></div>`}`;
  }else if(S.phase==="playing"&&S.turn===S.me){
    main=`<div class="status hot"><div class="kicker">ROUND ${S.round} · YOUR TURN</div><div class="big1">Hit or Stand on the table</div>
    <div class="sub">Keys: H to hit · S to stand</div></div>${amD?"":stats("Bet this round",me.bet)}`;
  }else if(S.phase==="playing"){
    const note=!me.in?"You’re sitting out this round.":!me.revealed&&!amD?"Your card is face down until your turn.":me.status==="bust"?"You busted this round.":amD?"You play last.":"Your turn is done.";
    main=`<div class="status"><div class="kicker">ROUND ${S.round} · PLAYING</div><div class="big1">${esc(nameOf(S.turn))}’s turn</div><div class="sub">${note}</div></div>
    ${me.in&&!amD?stats("Bet this round",me.bet):""}`;
  }else if(gameOver()){
    const w=P(S.winner),rank=[...S.players].sort((a,b)=>(b.id===S.winner)-(a.id===S.winner)||(b.outRound??1e9)-(a.outRound??1e9)||b.chips-a.chips).findIndex(p=>p.id===S.me)+1;
    const nth=n=>n+(n%10===1&&n!==11?"st":n%10===2&&n!==12?"nd":n%10===3&&n!==13?"rd":"th");
    main=`<div class="status hot"><div class="kicker">GAME OVER</div><div class="big1">${w?(w.id===S.me?"You win the table":`${esc(w.name)} wins the table`):"Game over"}</div>
    <div class="sub">${S.winner===S.me?`${me.chips} chips after ${S.round} rounds`:`You finished ${nth(rank)}${me.outRound!=null?` · out in round ${me.outRound}`:""}`}</div></div>`;
  }else{
    const r=me.res,sh=S.share,dp=P(S.dealer);
    const title=r?(amD?(r.bankrupt?"You went bankrupt":`Dealer ${sign(r.dl)}`):esc(resText(r))):"You sat out";
    main=`<div class="status ${sh?"broke":r&&r.dl>0?"hot":""}"><div class="kicker">ROUND ${S.round} · ${sh?"DEALER BANKRUPT":"RESULTS"}</div>
    <div class="big1 ${r?(amD&&r.bankrupt?"lose":resCls(r)):""}">${sh?`Winners were owed ${sh.owed}, the bank had ${sh.bank}`:title}</div>
    <div class="sub">${sh&&dp?`${esc(dp.name)} is knocked out · `:""}${S.next?`Next dealer: ${esc(nameOf(S.next))}`:""}</div></div>
    ${sh?shareHTML(sh):r?stats("This round",r.owed?`+${r.dl} of ${r.owed}`:sign(r.dl),r.dl>0?"g":""):""}`;
  }
  // phones: the round's controls live in the tray under (or beside) the table, the rest in the panel
  const mt=$("#mtray"),inTray=!!scr&&!!mt,off=S.off?`<div class="err">Reconnecting…</div>`:"";
  if(mt)mt.innerHTML=inTray?off+main:"";
  $("#console").innerHTML=`<div class="chead"><div class="t">Blackjack Night</div>
  ${S.solo?`<span class="cpu" style="font-size:11px;padding:3px 9px">VS COMPUTER</span>`:`<button class="code" id="copy" aria-label="Copy lobby code">${esc(want?.code)}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a9bcb1" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>`}
  <button class="mclose" id="mclose" aria-label="Close panel">${ico.close}</button></div>
  ${off}${inTray?"":main}<div class="list">${listHTML()}</div>
  <div class="foot"><button class="btn ghost" id="leave">${S.solo?"Leave table":"Leave lobby"}</button>${host&&S.phase!=="lobby"?`<button class="btn ghost" id="reset">Reset game</button>`:""}</div>`;
  const on=(id,f)=>{const e=document.querySelector("#console #"+id)||document.querySelector("#mtray #"+id);if(e)e.onclick=f};
  on("mclose",()=>setPanel(false));
  on("start",()=>send({t:"start"}));
  on("clear",()=>send({t:"clear"}));on("ready",()=>send({t:"ready"}));on("allin",()=>send({t:"allin"}));on("leave",leave);
  on("fd",()=>send({t:"dshow",show:false}));on("fu",()=>send({t:"dshow",show:true}));
  on("reset",()=>{if(confirm("Reset everyone’s chips and go back to the lobby?"))send({t:"reset"})});
  on("copy",()=>{try{navigator.clipboard.writeText(want.code).then(()=>toast("Code copied"),()=>toast("Code: "+want.code))}catch(e){toast("Code: "+want.code)}});
  document.querySelectorAll("[data-bet]").forEach(b=>b.onclick=()=>send({t:"bet",amount:+b.dataset.bet}));
}
addEventListener("keydown",e=>{
  if(e.key==="Escape"&&panel){setPanel(false);return}
  if((e.key==="f"||e.key==="F")&&!e.repeat&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){toggleFS();return}
  if(!S||S.phase!=="playing"||S.turn!==S.me||e.target.tagName==="INPUT"||e.repeat)return;
  if(e.key==="h"||e.key==="H")send({t:"hit"});
  if(e.key==="s"||e.key==="S"){const me=P(S.me);if(!(S.dealer===S.me&&val(me.hand)<17))send({t:"stand"})}
});
render();
const c0=ls.get("bj-code"),n0=ls.get("bj-name");if(c0&&n0)enter(c0,false,n0);
</script></body></html>
