<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone join</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b1210}
a{color:#e3b84f}a:hover{color:#f3d27e}
.back{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:1px solid #2c3d34;color:#eef3ef;text-decoration:none}
.go{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:16px;background:#e3b84f;color:#1e1600;font:700 17px 'Space Grotesk',sans-serif;text-decoration:none;box-shadow:0 8px 22px rgba(227,184,79,.28)}
.go:hover{color:#1e1600}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 20px; background: #0b1210; color: #eef3ef; font-family: Inter, system-ui, sans-serif; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 12px;">
    <a class="back" href="PhoneHome.dc.html" aria-label="Back"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <div style="flex: 1; font: 700 17px 'Space Grotesk', sans-serif;"><span style="color: #e3b84f;">♠</span> Blackjack Night</div>
    <div style="font-size: 13px; color: #a9bcb1;">as <b style="color: #f3d27e;">Kabir</b></div>
  </div>

  <div>
    <div style="font-size: 12px; letter-spacing: .12em; color: #e3b84f; font-weight: 700;">STEP 2 OF 2 · JOIN</div>
    <h1 style="margin: 4px 0 0; font: 700 28px/1.15 'Space Grotesk', sans-serif;">Enter the lobby code</h1>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <label for="pcode" style="font-size: 14px; font-weight: 600; color: #a9bcb1;">Lobby code</label>
    <input id="pcode" value="KQRT" maxlength="6" autocomplete="off" style="font: 700 32px 'Space Grotesk', sans-serif; letter-spacing: .4em; text-align: center; text-transform: uppercase; height: 76px; padding: 0 0 0 .4em; border-radius: 16px; border: 2px solid #e3b84f; background: #0b1210; color: #f3d27e; box-sizing: border-box; outline: none;">
    <div style="font-size: 13px; color: #a9bcb1;">Ask the host for the code at the top of their panel.</div>
  </div>

  <div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: #121a17; border: 1px solid #22302a; font-size: 13px; color: #a9bcb1;">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e3b84f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01"></path><path d="M11 12h1v5h1"></path></svg>
    <span>You start with the chips the host chose. If a round is already running you sit in from the next one.</span>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px;">
    <a class="go" href="PhoneHome.dc.html">Join lobby<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></a>
    <div style="text-align: center; font-size: 14px; color: #a9bcb1;">No code? <a href="PhoneCreate.dc.html" style="font-weight: 600;">Create a lobby instead</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
