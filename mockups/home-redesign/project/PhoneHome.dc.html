<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b1210}
a{color:#e3b84f}a:hover{color:#f3d27e}
.cd{position:absolute;width:62px;height:90px;border-radius:9px;background:#fff;color:#111;box-shadow:0 12px 20px rgba(0,0,0,.45);font:700 20px/1 'Space Grotesk',sans-serif}
.cd .r{position:absolute;left:7px;top:7px}.cd .c{position:absolute;right:7px;bottom:6px;font-size:28px}
.cd.red{color:#c0392b}
.cd.bk{background:repeating-linear-gradient(45deg,#8a2333 0 6px,#6b1a27 6px 12px);box-shadow:inset 0 0 0 3px #fff,0 12px 20px rgba(0,0,0,.45)}
.path{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;text-decoration:none;color:#eef3ef;background:#121a17;border:1px solid #2c3d34}
.path:hover{color:#eef3ef;border-color:#e3b84f}
.path.gold{background:#1a1406;border-color:#e3b84f}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 22px; background: #0b1210; color: #eef3ef; font-family: Inter, system-ui, sans-serif; overflow: hidden;">

  <div style="position: relative; overflow: hidden; height: 210px; flex: none; border-radius: 22px; background: radial-gradient(ellipse at 70% 30%, #1d7a4f, #0d3f27 80%); box-shadow: inset 0 0 0 2px rgba(227,184,79,.35), inset 0 0 60px rgba(0,0,0,.45); padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;">
    <div style="font: 700 19px 'Space Grotesk', sans-serif;"><span style="color: #e3b84f;">♠</span> Blackjack Night</div>
    <div aria-hidden="true" style="position: absolute; right: 18px; top: 46px; width: 150px; height: 120px;">
      <div class="cd bk" style="left: 0; top: 18px; transform: rotate(-14deg);"></div>
      <div class="cd" style="left: 42px; top: 4px; transform: rotate(-1deg);"><span class="r">A♠</span><span class="c">♠</span></div>
      <div class="cd red" style="left: 84px; top: 16px; transform: rotate(12deg);"><span class="r">K♥</span><span class="c">♥</span></div>
    </div>
    <div style="max-width: 180px;">
      <div style="font: 700 26px/1.1 'Space Grotesk', sans-serif;">Pull up a chair.</div>
      <div style="font-size: 13px; color: rgba(255,255,255,.78); margin-top: 4px;">Friends or the computer · up to 10 players</div>
    </div>
  </div>

  <div>
    <div style="font-size: 12px; letter-spacing: .12em; color: #e3b84f; font-weight: 700;">STEP 1 OF 2</div>
    <h1 style="margin: 4px 0 0; font: 700 28px/1.15 'Space Grotesk', sans-serif;">Who’s playing tonight?</h1>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <label for="pname" style="font-size: 14px; font-weight: 600; color: #a9bcb1;">Your name</label>
    <input id="pname" value="Kabir" maxlength="16" style="font: 600 18px Inter, sans-serif; height: 54px; padding: 0 16px; border-radius: 14px; border: 2px solid #e3b84f; background: #0b1210; color: #eef3ef; box-sizing: border-box; outline: none;">
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 12px; letter-spacing: .12em; color: #a9bcb1; font-weight: 700;">THEN PICK A PATH</div>
    <a class="path gold" href="PhoneCreate.dc.html">
      <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 13px; background: #e3b84f; display: flex; align-items: center; justify-content: center; flex: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1e1600" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></span>
      <span style="flex: 1; min-width: 0;"><span style="display: block; font: 700 17px 'Space Grotesk', sans-serif;">Create a lobby</span><span style="display: block; font-size: 13px; color: #a9bcb1;">Friends with a code, or vs computer</span></span>
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e3b84f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
    <a class="path" href="PhoneJoin.dc.html">
      <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 13px; background: #1d2a24; border: 1px solid #3a5045; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#eef3ef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path></svg></span>
      <span style="flex: 1; min-width: 0;"><span style="display: block; font: 700 17px 'Space Grotesk', sans-serif;">Join a lobby</span><span style="display: block; font-size: 13px; color: #a9bcb1;">Got a code? Enter it and sit down</span></span>
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a9bcb1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
  </div>
</div>
</x-dc>

</body>
</html>
